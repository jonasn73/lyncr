# lyncr - Local Postgres (no signup required)
# Run: docker compose up -d
# Then: npm run db:schema

services:
  postgres:
    image: postgres:16-alpine
    container_name: lyncr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lyncr
    ports:
      - "5432:5432"
    volumes:
      - lyncr_pg_data:/var/lib/postgresql/data

volumes:
  lyncr_pg_data:
