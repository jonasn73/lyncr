name: CI

# Vercel already builds every push, which covers app-graph types. This covers
# what that build does not: the test suite, and the type errors that only a
# full tsc pass sees (tsconfig includes **/*.ts, so tests are checked here and
# nowhere else).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Node the app is developed and deployed on.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Mobile install
        working-directory: mobile
        run: npm ci

      - name: Mobile types
        working-directory: mobile
        run: npm run typecheck

      - name: Mobile lint
        working-directory: mobile
        run: npm run lint

      - name: Mobile tests
        working-directory: mobile
        run: npm test

      # Non-blocking (continue-on-error): 5 known prod vulnerabilities as of 2026-09-10, both
      # requiring a breaking major-version bump (@telnyx/webrtc, @stripe/terminal-js — live
      # calling and card-present payments) that needs real regression testing, not
      # `npm audit fix --force` on a whim. Visible on every run so it can't silently regress
      # further; make it blocking once those two upgrades are done and reviewed.
      - name: Dependency audit (informational)
        continue-on-error: true
        run: npm audit --omit=dev

      # Same treatment: 37 remaining after a safe `npm audit fix` (2026-09-10), all inside
      # Expo/Metro's own toolchain (@expo/config-plugins, ws in metro/react-devtools-core) —
      # forcing majors there needs a real device build + smoke test, not a blind CI fix.
      - name: Mobile dependency audit (informational)
        working-directory: mobile
        continue-on-error: true
        run: npm audit --omit=dev

  db-bootstrap:
    name: fresh database bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Proves scripts/migrate.mjs actually brings an empty database up to today's real schema —
    # the gap this replaced: db:schema used to only apply migrations 001-004, so nothing ever
    # verified a truly fresh environment could reach production's current state.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lyncr
          POSTGRES_PASSWORD: lyncr
          POSTGRES_DB: lyncr_bootstrap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Bootstrap a fresh database from the baseline snapshot
        run: npm run db:schema
        env:
          DATABASE_URL: postgresql://lyncr:lyncr@localhost:5432/lyncr_bootstrap_test

      - name: Bootstrap must be idempotent (no-op on a second run)
        run: npm run db:schema
        env:
          DATABASE_URL: postgresql://lyncr:lyncr@localhost:5432/lyncr_bootstrap_test

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # RESEND_API_KEY / TELNYX_API_KEY are deliberately not set — every email/SMS send path in
    # this codebase already fails soft rather than throwing when they're missing (see
    # playwright.config.ts's top comment), so signup/booking/password-reset flows complete
    # normally for testing without contacting a real third party or spending money.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lyncr
          POSTGRES_PASSWORD: lyncr
          POSTGRES_DB: lyncr_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lyncr:lyncr@localhost:5432/lyncr_e2e_test
      SESSION_SECRET: ci-e2e-session-secret-not-for-production-use
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

# Deliberately not running eslint here. It reports ~305 errors on main today
# (verified 2026-09-10 — the eslint.config.mjs ignores didn't exclude .claude/**,
# so a naive run also picks up ~2,000 more from stale build output in leftover
# .claude/worktrees/* checkouts; that's now fixed, this count is real source only),
# almost all of them react-hooks/set-state-in-effect and react-hooks/refs, so a
# blocking step would fail every pull request from the moment it landed and a
# non-blocking one is a permanently red tick nobody reads. Add it once those two
# families are dealt with, and it will mean something on the day it goes red.
